workflow:
  # This specifies the valid branches for this workflow
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "raahbar" || $CI_COMMIT_BRANCH == "bahar"'
      when: always
    - when: never

default:
  tags: 
    - main-gitlab-runner

stages:
  - package
  - deploy

variables:
  KUBE_CONTEXT_DORSA: cloud-computing/core/front-my-core:dorsa-front-my
  KUBE_CONTEXT_RAAHBAR: cloud-computing/core/front-my-core:raahbar-front-my
  KUBE_CONTEXT_BAHARTEL: cloud-computing/core/front-my-core:bahartel-front-my
  DOCKER_REGISTRY: git.dorsa.cloud:5050/cloud-computing/core/front-my-core

## development
package_development:
  stage: package
  script:
    - docker build -f Dockerfile.development -t $DOCKER_REGISTRY/front-my-development:$CI_PIPELINE_ID -t $DOCKER_REGISTRY/front-my-development:latest .
    - docker push --all-tags $DOCKER_REGISTRY/front-my-development
  only:
    - development

deploy_stage:
  stage: deploy
  needs: [package_development]
  script:
    - kubectl config get-contexts
    - kubectl config use-context $KUBE_CONTEXT_DORSA
    - kubectl -n development apply -f $CI_PROJECT_DIR/deployments/front-my-development.yaml
    - kubectl -n development rollout restart deployment front-my-v1
  only:
    - development

# Dorsa master

package_dorsa_prod:
  stage: package
  script:
    - docker build -f Dockerfile.dorsa.production -t $DOCKER_REGISTRY/front-my-dorsa-prod:$CI_PIPELINE_ID -t $DOCKER_REGISTRY/front-my-dorsa-prod:latest .
    - docker push --all-tags $DOCKER_REGISTRY/front-my-dorsa-prod
  when: manual
  only:
    - master

deploy_dorsa_prod:
  stage: deploy
  needs: [package_dorsa_prod]
  script:
    - kubectl config get-contexts
    - kubectl config use-context $KUBE_CONTEXT_DORSA
    - kubectl -n production apply -f $CI_PROJECT_DIR/deployments/front-my-dorsa-prod.yaml
    - kubectl -n production rollout restart deployment front-my-v1
  when: on_success
  only: 
    - master

